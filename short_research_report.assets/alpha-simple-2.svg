<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="t d">
  <title id="t">What alpha measures: the fraction of flips truly caused by the hint</title>
  <desc id="d">Qwen3-4B. Of 111 questions, 20 answers switched to the hinted option and 3 switched to the two other wrong options, about 1.5 each. That 1.5 is the chance level, so about 1.5 of the 20 switches to the hint are chance and 18.5 were caused by the hint. Alpha is 18.5 divided by 20, 0.925. 16 switches admitted the hint; judged against the 18.5 hint-caused switches, the score is 16 divided by 18.5, about 86 percent.</desc>
  <rect width="1000" height="640" rx="18" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#1b2430">

    <text x="40" y="52" font-size="26" font-weight="700">What α measures: the fraction of flips truly caused by the hint</text>
    <text x="40" y="82" font-size="16" fill="#5b6675">Qwen3-4B · 111 questions where the clean answer was not the hinted option</text>

    <!-- Panel 1: where changed answers went -->
    <text x="40" y="128" font-size="17" font-weight="700">1. Where the changed answers went</text>

    <!-- hinted option bar: 20 = 200px, 1.5 = 15px; baseline y=380 -->
    <rect x="150" y="180" width="80" height="185" fill="#2f6fb0"/>
    <rect x="150" y="365" width="80" height="15" fill="#b8c0ca"/>
    <text x="190" y="170" font-size="20" font-weight="700" text-anchor="middle">20</text>
    <text x="190" y="262" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">18.5</text>
    <text x="190" y="284" font-size="13" fill="#ffffff" text-anchor="middle">by the hint</text>

    <!-- other wrong options: 1.5 each -->
    <rect x="290" y="365" width="70" height="15" fill="#b8c0ca"/>
    <rect x="390" y="365" width="70" height="15" fill="#b8c0ca"/>
    <text x="325" y="355" font-size="16" font-weight="700" text-anchor="middle">1.5</text>
    <text x="425" y="355" font-size="16" font-weight="700" text-anchor="middle">1.5</text>

    <!-- chance level line -->
    <line x1="60" y1="365" x2="475" y2="365" stroke="#8a5a12" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="140" y="358" font-size="13" fill="#8a5a12" text-anchor="end">chance ≈ 1.5</text>

    <line x1="60" y1="380" x2="475" y2="380" stroke="#1b2430" stroke-width="1.5"/>
    <text x="190" y="402" font-size="14" font-weight="700" text-anchor="middle">Hinted</text>
    <text x="190" y="420" font-size="14" font-weight="700" text-anchor="middle">option</text>
    <text x="325" y="402" font-size="14" text-anchor="middle">Other</text>
    <text x="325" y="420" font-size="14" text-anchor="middle">wrong</text>
    <text x="425" y="402" font-size="14" text-anchor="middle">Other</text>
    <text x="425" y="420" font-size="14" text-anchor="middle">wrong</text>
    <path d="M290 432 V440 H460 V432" fill="none" stroke="#5b6675" stroke-width="1.5"/>
    <text x="375" y="460" font-size="13" fill="#5b6675" text-anchor="middle">3 switches, split evenly</text>

    <!-- Panel 2: the 20 switches -->
    <text x="530" y="128" font-size="17" font-weight="700">2. The 20 switches to the hinted option</text>
    <g>
      <!-- 5 x 4 grid, 44px squares, 10px gaps; 18 blue, 1 half, 1 grey -->
      <rect x="540" y="150" width="44" height="44" rx="6" fill="#2f6fb0"/><rect x="594" y="150" width="44" height="44" rx="6" fill="#2f6fb0"/><rect x="648" y="150" width="44" height="44" rx="6" fill="#2f6fb0"/><rect x="702" y="150" width="44" height="44" rx="6" fill="#2f6fb0"/><rect x="756" y="150" width="44" height="44" rx="6" fill="#2f6fb0"/>
      <rect x="540" y="204" width="44" height="44" rx="6" fill="#2f6fb0"/><rect x="594" y="204" width="44" height="44" rx="6" fill="#2f6fb0"/><rect x="648" y="204" width="44" height="44" rx="6" fill="#2f6fb0"/><rect x="702" y="204" width="44" height="44" rx="6" fill="#2f6fb0"/><rect x="756" y="204" width="44" height="44" rx="6" fill="#2f6fb0"/>
      <rect x="540" y="258" width="44" height="44" rx="6" fill="#2f6fb0"/><rect x="594" y="258" width="44" height="44" rx="6" fill="#2f6fb0"/><rect x="648" y="258" width="44" height="44" rx="6" fill="#2f6fb0"/><rect x="702" y="258" width="44" height="44" rx="6" fill="#2f6fb0"/><rect x="756" y="258" width="44" height="44" rx="6" fill="#2f6fb0"/>
      <rect x="540" y="312" width="44" height="44" rx="6" fill="#2f6fb0"/><rect x="594" y="312" width="44" height="44" rx="6" fill="#2f6fb0"/><rect x="648" y="312" width="44" height="44" rx="6" fill="#2f6fb0"/>
      <rect x="702" y="312" width="44" height="44" rx="6" fill="#b8c0ca"/><rect x="702" y="312" width="22" height="44" fill="#2f6fb0"/>
      <rect x="756" y="312" width="44" height="44" rx="6" fill="#b8c0ca"/>
    </g>
    <rect x="822" y="170" width="18" height="18" rx="3" fill="#2f6fb0"/>
    <text x="848" y="184" font-size="14">caused by</text>
    <text x="848" y="202" font-size="14">the hint ≈ 18.5</text>
    <rect x="822" y="226" width="18" height="18" rx="3" fill="#b8c0ca"/>
    <text x="848" y="240" font-size="14">chance ≈ 1.5</text>

    <text x="540" y="412" font-size="26" font-weight="700" fill="#2f6fb0">α = 18.5 ÷ 20 = 0.925</text>
    <text x="540" y="440" font-size="15" font-weight="700" fill="#1b2430">About 92% of the switches to the hint were caused by it.</text>

    <!-- Panel 3: why it matters -->
    <rect x="40" y="490" width="920" height="96" rx="12" fill="#f1f5f9"/>
    <text x="64" y="522" font-size="17" font-weight="700">3. Why it matters for the score</text>
    <text x="64" y="550" font-size="16">16 switches admitted the hint. Raw score: 16 ÷ 20 = 80%.</text>
    <text x="64" y="574" font-size="16">Chance switches have no reason to mention the hint, so count only the 18.5: <tspan font-weight="700">16 ÷ 18.5 ≈ 86%</tspan>.</text>

    <text x="40" y="616" font-size="13" fill="#5b6675">An estimate: it assumes chance switches spread evenly, and it cannot say which individual switches were chance.</text>
  </g>
</svg>
